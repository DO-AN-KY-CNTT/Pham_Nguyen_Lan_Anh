# NutriBudget Backend Configuration
spring.application.name=NutriBudget API

# MySQL Database Configuration
# Support environment variables with fallback defaults for local machine
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nutribudget}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT Configuration
app.jwt.secret=NutriBudgetSecretKey2024VeryLongAndSecureKeyForJWTTokenGeneration1234567890
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.nutribudget=INFO

# SQL Init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true